services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    volumes:
      - moravec-data:/app/data
    env_file:
      - ./apps/backend/.env
    environment:
      DB_PATH: /app/data/moravec.sqlite
      PORT: "3000"
      NODE_ENV: production
      TRUSTED_PROXY_IP: "172.30.60.2"
    networks:
      - backend_proxy
      - app_internal
      - backend_egress
    cap_drop:
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Baked into the client bundle at build time. Relative, not
        # absolute — nginx serves frontend and backend from the same
        # origin (see infra/nginx/default.conf), so the browser can just
        # call /api/* on whatever host it loaded the page from.
        NEXT_PUBLIC_API_URL: /api
    environment:
      # Runtime-only (not baked into the client bundle): overrides
      # NEXT_PUBLIC_API_URL for code that runs inside this container
      # (Server Components, route rendering) — "backend" resolves via
      # Compose's internal network, where "localhost" would not.
      API_URL: http://backend:3000
    networks:
      - app_internal
      - frontend_proxy
    cap_drop:
      - NET_RAW
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Fronts frontend + backend on one origin, split by path (see
  # infra/nginx/default.conf: / -> frontend, /api/* -> backend). Not
  # published to the host — only cloudflared talks to it, over the
  # compose network.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      backend_proxy:
        ipv4_address: 172.30.60.2
      frontend_proxy:
      tunnel_ingress:
    cap_drop:
      - NET_RAW
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Cloudflare Tunnel: the only way in from the public internet, no
  # port-forwarding on the router. Tunnel + its one Public Hostname
  # (moravec.elgatoylacaja.com -> http://nginx:80) are configured in the
  # Cloudflare Zero Trust dashboard; this just runs the connector with the
  # token that dashboard gives you.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      tunnel_ingress:
        ipv4_address: 172.30.60.10
    cap_drop:
      - NET_RAW
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy

networks:
  backend_proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.60.0/29
  frontend_proxy:
    internal: true
  app_internal:
    internal: true
  backend_egress:
  tunnel_ingress:
    ipam:
      config:
        - subnet: 172.30.60.8/29

volumes:
  moravec-data:
