# Single public origin, split by path: / -> frontend, /api/* -> backend
# (prefix stripped by the trailing slash on proxy_pass). Only reachable from
# the cloudflared container over the compose network, not published to the
# host — Cloudflare Tunnel is the only public entry point.
log_format moravec '$request_method $status $request_time';

geo $realip_remote_addr $trusted_ingress {
    default 0;
    172.30.60.10 1;
    127.0.0.1 1;
    ::1 1;
}

server {
    listen 80;
    access_log /dev/stdout moravec;
    error_log /dev/null;
    set_real_ip_from 172.30.60.10;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    if ($trusted_ingress = 0) { return 403; }

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
